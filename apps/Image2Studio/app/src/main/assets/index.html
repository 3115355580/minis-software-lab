<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Image2Studio</title><style>
:root{--bg:#090b10;--surface:#111521;--card:#171d2b;--card2:#1e2636;--line:#293244;--text:#f7f8ff;--muted:#8993a8;--p:#7c3aed;--p2:#2563eb;--g:#22c55e;--r:#ef4444}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;padding:12px 12px 86px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--p),#06b6d4);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.status-pill{font-size:12px;padding:8px 10px;border-radius:999px;background:#132016;color:#9ff3b5;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-card{border-radius:26px;padding:18px;background:linear-gradient(135deg,#171d2b,#101521);border:1px solid var(--line);box-shadow:0 12px 40px #0007;margin-bottom:12px}.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero-title{font-size:28px;line-height:1.1;margin:0 0 8px}.hero-title span{background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;color:transparent}.hero-sub{color:var(--muted);font-size:13px;line-height:1.45}.quick{display:flex;gap:8px;margin-top:14px;overflow:auto}.chip{border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap}.page{display:none}.page.on{display:block}.section-title{font-size:22px;margin:18px 4px 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:10px 0}.label{font-size:12px;color:var(--muted);margin:12px 2px 6px}textarea,input,select{width:100%;border:1px solid #2b3548;background:#0c111b;color:var(--text);border-radius:18px;padding:14px;font-size:16px;outline:none}textarea{min-height:132px;resize:none}.params{display:grid;grid-template-columns:1fr 1fr .72fr;gap:10px}.primary{width:100%;border:0;border-radius:20px;padding:16px 16px;font-size:17px;font-weight:800;color:white;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 12px 28px rgba(124,58,237,.28)}button{border:0;border-radius:18px;padding:14px;color:white;background:#334155;font-size:15px}button:disabled{opacity:.55}.green{background:linear-gradient(135deg,#22c55e,#16a34a)}.ghost{background:#253044}.result-head{display:flex;align-items:center;justify-content:space-between}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.imgcard{border-radius:18px;overflow:hidden;background:#080c14;border:1px solid #263047}.imgcard img{width:100%;display:block}.imgcap{padding:9px;color:#aab5ca;font-size:12px}.empty{color:var(--muted);padding:18px;border:1px dashed #334155;border-radius:18px;text-align:center}.hist{display:flex;flex-direction:column;gap:12px}.hist-item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}.hist-top{font-size:13px;color:#dbe4ff;font-weight:700}.hist-prompt{color:var(--muted);font-size:13px;line-height:1.45;margin:6px 0 10px}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs img{width:82px;height:82px;border-radius:16px;object-fit:cover}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.bottom-nav{position:fixed;left:12px;right:12px;bottom:12px;height:64px;background:rgba(17,21,33,.94);backdrop-filter:blur(16px);border:1px solid #30394c;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 12px 40px #000b}.navbtn{background:transparent;border-radius:18px;color:#94a3b8;padding:6px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}.navbtn b{font-size:20px}.navbtn.on{background:linear-gradient(135deg,var(--p),var(--p2));color:white}.toast{position:fixed;left:18px;right:18px;bottom:90px;background:#111827;border:1px solid #334155;border-radius:18px;padding:14px;display:none;color:white}.log{white-space:pre-wrap;color:#93a4bd;font-size:13px;line-height:1.45}.model-item{padding:12px;border-radius:16px;background:#0c111b;margin:8px 0;color:#dbeafe}@media(max-width:390px){.params{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.hero-title{font-size:24px}.status-pill{display:none}}
</style></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="logo">I2</div><div><h1>Image2Studio</h1><p>v2.1 · image2 App</p></div></div><div id="status" class="status-pill">就绪</div></header><section class="hero-card"><div class="hero-row"><div><h2 class="hero-title"><span>AI 图像创作台</span></h2><div class="hero-sub">原生桥接 API、选图与相册保存。生成后自动入历史，手动保存进系统相册。</div></div></div><div class="quick"><span class="chip">Auto / 4K</span><span class="chip">16:9 9:16 1:1</span><span class="chip">历史画廊</span><span class="chip">本机保存 Key</span></div></section>
<section id="txt" class="page on"><h2 class="section-title">文生图</h2><div class="card"><div class="label">提示词</div><textarea id="prompt" placeholder="例如：陕西咸阳520宣传海报，现代国风，红金色，浪漫城市地标，商业海报设计"></textarea><div class="label">反向提示词</div><input id="neg" placeholder="可选，例如：低清晰度，文字错误"><div class="params"><div><div class="label">比例</div><select id="ratio"></select></div><div><div class="label">清晰度</div><select id="quality"></select></div><div><div class="label">数量</div><select id="num"></select></div></div><div style="height:14px"></div><button id="gen" class="primary">开始生成</button></div><div class="card"><div class="result-head"><h2 style="margin:0">当前结果</h2></div><div id="results" class="empty">生成结果会显示在这里</div><div class="actions"><button id="saveCur" class="green">保存到相册</button><button id="shareCur" class="ghost">分享提示</button></div></div></section>
<section id="edit" class="page"><h2 class="section-title">图生图</h2><div class="card"><button id="pick" class="ghost">选择参考图</button><p id="picked" class="hero-sub">未选择图片</p><div class="label">编辑提示词</div><textarea id="eprompt" placeholder="例如：保持构图，把人物衣服改为红色，增强真实光影"></textarea><div class="params"><div><div class="label">比例</div><select id="eratio"></select></div><div><div class="label">清晰度</div><select id="equality"></select></div><div><div class="label">数量</div><select id="enum"></select></div></div><div style="height:14px"></div><button id="editBtn" class="primary">开始编辑</button></div></section>
<section id="hist" class="page"><h2 class="section-title">历史</h2><div class="card"><div id="history" class="hist"><div class="empty">暂无历史</div></div><button id="clearHist" class="ghost" style="width:100%;margin-top:12px">清空历史</button></div></section>
<section id="set" class="page"><h2 class="section-title">设置</h2><div class="card"><div class="label">Base URL</div><input id="base"><div class="label">API Key</div><input id="key" type="password"><div class="label">模型</div><input id="model"><label style="display:flex;gap:8px;align-items:center;margin:12px 0;color:#aab5ca"><input id="remember" type="checkbox" style="width:auto">记住 API Key</label><div class="actions"><button id="models" class="primary">获取模型</button><button id="saveSet" class="ghost">保存设置</button></div><div id="modelList"></div></div><div class="card"><h2 style="margin-top:0">日志</h2><div id="log" class="log">等待操作</div></div></section></main><nav class="bottom-nav"><button class="navbtn on" data-page="txt"><b>✦</b>文生图</button><button class="navbtn" data-page="edit"><b>◈</b>图生图</button><button class="navbtn" data-page="hist"><b>▣</b>历史</button><button class="navbtn" data-page="set"><b>⚙</b>设置</button></nav><div id="toast" class="toast"></div><script>
const ratios=['Auto','16:9','9:16','1:1','4:3','3:4'], qs=['Auto','4K'], nums=['1','2','3','4'];let cur=[];function $(id){return document.getElementById(id)}function fill(id,a){$(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('')}['ratio','eratio'].forEach(id=>fill(id,ratios));['quality','equality'].forEach(id=>fill(id,qs));['num','enum'].forEach(id=>fill(id,nums));function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}function log(s){$('log').textContent=s}function status(s){$('status').textContent=s}document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(b.dataset.page).classList.add('on');if(b.dataset.page==='hist')loadHist()});
function settings(){return{baseUrl:$('base').value.trim(),apiKey:$('key').value.trim(),model:$('model').value.trim()||'gpt-image-2',remember:$('remember').checked}}function loadSet(){let s=JSON.parse(Android.getSettings());$('base').value=s.baseUrl||'https://factory.pub';$('key').value=s.apiKey||'';$('model').value=s.model||'gpt-image-2';$('remember').checked=!!s.remember}loadSet();$('saveSet').onclick=()=>{Android.saveSettings(JSON.stringify(settings()));toast('设置已保存')};let seq=1,pending={};function call(fn,args,btn,doing){let id='r'+seq++;let old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent=doing}status(doing);return new Promise(res=>{pending[id]=r=>{if(btn){btn.disabled=false;btn.textContent=old}status('就绪');res(r)};Android[fn](id,...args)})}window.nativeResolve=r=>{let cb=pending[r.id];if(cb){delete pending[r.id];cb(r)}};
$('models').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('requestModels',[s.baseUrl,s.apiKey],$('models'),'获取中');if(!r.ok){toast(r.error);log(r.error);return}$('modelList').innerHTML=(r.body.data||[]).map(m=>`<div class="model-item" onclick="model.value='${m.id}'">${m.id}</div>`).join('');toast('模型已更新')};
function show(items){cur=items||[];$('results').className=cur.length?'gallery':'empty';$('results').innerHTML=cur.length?cur.map((it,i)=>`<div class="imgcard"><img src="${it.fileUrl}"><div class="imgcap">#${i+1} · 已入历史</div></div>`).join(''):'没有图片数据'}
$('gen').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));$('results').className='empty';$('results').textContent='生成中，请稍候...';let r=await call('generateText',[s.baseUrl,s.apiKey,s.model,$('prompt').value,$('neg').value,parseInt($('num').value),$('ratio').value,$('quality').value],$('gen'),'生成中...');if(!r.ok){$('results').textContent='生成失败：'+r.error;toast(r.error);log(r.error);return}show(r.items);loadHist();toast('生成完成')};
$('pick').onclick=()=>Android.pickImages();window.onImagesPicked=o=>{$('picked').textContent='已选择 '+o.count+' 张图片'};$('editBtn').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('generateEdit',[s.baseUrl,s.apiKey,s.model,$('eprompt').value,parseInt($('enum').value),$('eratio').value,$('equality').value],$('editBtn'),'编辑中...');if(!r.ok){toast(r.error);log(r.error);return}show(r.items);document.querySelector('[data-page=txt]').click();loadHist();toast('编辑完成')};
$('saveCur').onclick=async()=>{let r=await call('saveCurrentToGallery',[],$('saveCur'),'保存中');toast(r.ok?'已保存 '+r.saved+' 张':r.error)};$('shareCur').onclick=()=>toast('请先保存到相册后分享更稳定');function loadHist(){let h=JSON.parse(Android.loadHistory());$('history').innerHTML=h.length?h.map((x,i)=>`<div class="hist-item"><div class="hist-top">${x.time} · ${x.mode}</div><div class="hist-prompt">${x.prompt}</div><div class="thumbs">${(x.paths||[]).map(p=>`<img src="file://${p}">`).join('')}</div><div class="actions"><button onclick='loadItem(${JSON.stringify(x.paths||[])})'>载入</button><button class="green" onclick='saveHist(${JSON.stringify(x.paths||[])})'>保存到相册</button></div></div>`).join(''):'<div class="empty">暂无历史</div>'}function loadItem(paths){show(paths.map(p=>({fileUrl:'file://'+p,path:p})));document.querySelector('[data-page=txt]').click()}async function saveHist(paths){let id='r'+seq++;pending[id]=r=>toast(r.ok?'已保存 '+r.saved+' 张':r.error);Android.saveHistoryItemToGallery(id,JSON.stringify(paths))}$('clearHist').onclick=()=>{Android.clearHistory();loadHist();toast('已清空')};loadHist();
</script></body></html>
