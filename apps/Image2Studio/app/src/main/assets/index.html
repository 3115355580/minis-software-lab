<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Image2Studio</title><style>
:root{--bg:#070a10;--card:#121826;--field:#090e18;--line:#2a354a;--text:#f7f8ff;--muted:#8d98ad;--p:#7c3aed;--p2:#2563eb;--g:#22c55e;--r:#ef4444;--safeTop:28px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;padding:calc(var(--safeTop) + 8px) 14px 126px}.appbar{height:52px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:grid;place-items:center;font-weight:900;font-size:17px}.title h1{margin:0;font-size:21px;line-height:1}.title p{margin:4px 0 0;color:var(--muted);font-size:12px}.status{margin-left:auto;max-width:36vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#9ff3b5;background:#102018;border-radius:999px;padding:7px 9px}.page{display:none}.page.on{display:block}.headline{display:flex;align-items:end;justify-content:space-between;margin:12px 2px 10px}.headline h2{font-size:28px;margin:0}.headline span{font-size:12px;color:var(--muted)}.panel{background:linear-gradient(180deg,#151d2e,#101724);border:1px solid var(--line);border-radius:28px;padding:16px}.param-row{display:grid;grid-template-columns:1fr 1fr .72fr;gap:8px;margin-bottom:12px}.mini-label{font-size:11px;color:var(--muted);margin:0 0 5px 4px}select,input,textarea{width:100%;background:var(--field);border:1px solid #2a354a;color:var(--text);border-radius:18px;font-size:16px;outline:none}select{height:54px;padding:0 12px}input{height:54px;padding:0 14px}textarea{min-height:178px;padding:16px;resize:none;line-height:1.45}.prompt-label{font-size:12px;color:var(--muted);margin:12px 0 6px 4px}.primary{width:100%;height:58px;border:0;border-radius:22px;color:white;font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--p2))}button{border:0;border-radius:18px;padding:14px;color:white;background:#334155;font-size:15px}button:disabled{opacity:.55}.green{background:linear-gradient(135deg,#22c55e,#16a34a)}.ghost{background:#253044}.result{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px}.result.compact .result-body{display:none}.result h3{margin:0;font-size:18px}.empty{color:var(--muted);padding:14px;border:1px dashed #334155;border-radius:16px;text-align:center;margin-top:10px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.imgcard{border-radius:18px;overflow:hidden;background:#080c14;border:1px solid #263047}.imgcard img{width:100%;display:block}.imgcap{padding:8px;color:#aab5ca;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.actions.three{grid-template-columns:repeat(3,1fr)}.picked-grid{display:flex;gap:10px;overflow:auto;margin:10px 0}.pick-card{position:relative;min-width:86px;width:86px;height:86px;border-radius:16px;overflow:hidden;border:1px solid #334155;background:#0c111b}.pick-card img{width:100%;height:100%;object-fit:cover}.pick-card button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;padding:0;background:#ef4444;font-size:16px}.hist{display:flex;flex-direction:column;gap:12px}.hist-item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}.hist-top{font-size:13px;color:#dbe4ff;font-weight:700}.hist-prompt{color:var(--muted);font-size:13px;line-height:1.45;margin:6px 0 10px}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs img{width:82px;height:82px;border-radius:16px;object-fit:cover}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:86px;background:#0b0f18;border-top:1px solid #273247;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px 10px;box-shadow:0 -8px 30px #000;z-index:10}.navbtn{background:transparent;border-radius:18px;color:#94a3b8;padding:5px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}.navbtn b{font-size:20px}.navbtn.on{background:linear-gradient(135deg,var(--p),var(--p2));color:white}.toast{position:fixed;left:18px;right:18px;bottom:98px;background:#111827;border:1px solid #334155;border-radius:18px;padding:14px;display:none;color:white;z-index:20}.log{white-space:pre-wrap;color:#93a4bd;font-size:13px;line-height:1.45}.model-item{padding:12px;border-radius:16px;background:#0c111b;margin:8px 0;color:#dbeafe}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}.lightbox.on{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:18px;object-fit:contain}.lightbox .x{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:#253044;font-size:24px;padding:0}.set-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:10px 0}@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.param-row{gap:6px}.param-row select{font-size:14px;padding:0 8px}.headline h2{font-size:25px}.status{display:none}.gallery{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="appbar"><div class="logo">I2</div><div class="title"><h1>Image2Studio</h1><p>v2.2.9 · image2 App</p></div><div id="status" class="status">就绪</div></header><section id="txt" class="page on"><div class="headline"><h2>文生图</h2><span>Auto / 4K</span></div><div class="panel"><div class="param-row"><div><div class="mini-label">比例</div><select id="ratio"></select></div><div><div class="mini-label">清晰度</div><select id="quality"></select></div><div><div class="mini-label">数量</div><select id="num"></select></div></div><div class="prompt-label">提示词</div><textarea id="prompt" placeholder="描述你想生成的画面"></textarea><div class="prompt-label">反向提示词</div><input id="neg" placeholder="可选"><div style="height:14px"></div><button id="gen" class="primary">开始生成</button></div><div id="resultCard" class="result compact"><h3>当前结果</h3><div id="results" class="result-body empty">生成后显示结果</div><div class="actions three result-body"><button id="shareCur" class="ghost">分享</button><button id="editCur" class="primary">编辑</button><button id="saveCur" class="green">保存</button></div></div></section><section id="edit" class="page"><div class="headline"><h2>图生图</h2><span>1-4 张参考图</span></div><div class="panel"><button id="pick" class="ghost" style="width:100%">导入图片</button><p id="picked" style="color:var(--muted);font-size:13px">未选择图片</p><div id="pickedGrid" class="picked-grid"></div><div class="param-row"><div><div class="mini-label">比例</div><select id="eratio"></select></div><div><div class="mini-label">清晰度</div><select id="equality"></select></div><div><div class="mini-label">数量</div><select id="enum"></select></div></div><div class="prompt-label">编辑提示词</div><textarea id="eprompt" placeholder="描述你想如何修改图片"></textarea><div style="height:14px"></div><button id="editBtn" class="primary">开始编辑</button></div><div id="editResultCard" class="result compact"><h3>图生图结果</h3><div id="editResults" class="result-body empty">编辑后显示结果</div><div class="actions three result-body"><button id="shareEdit" class="ghost">分享</button><button id="editEdit" class="primary">编辑</button><button id="saveEdit" class="green">保存</button></div></div></section><section id="hist" class="page"><div class="headline"><h2>历史</h2><span>本机画廊</span></div><div class="set-card"><div id="history" class="hist"><div class="empty">暂无历史</div></div><button id="clearHist" class="ghost" style="width:100%;margin-top:12px">清空历史</button></div></section><section id="set" class="page"><div class="headline"><h2>设置</h2><span>接口配置</span></div><div class="set-card"><div class="mini-label">Base URL</div><input id="base"><div class="mini-label">API Key</div><input id="key" type="password"><div class="mini-label">模型</div><input id="model"><label style="display:flex;gap:8px;align-items:center;margin:12px 0;color:#aab5ca"><input id="remember" type="checkbox" style="width:auto;height:auto">记住 API Key</label><div class="actions"><button id="models" class="primary">获取模型</button><button id="saveSet" class="ghost">保存设置</button></div><div id="modelList"></div></div><div class="set-card"><h3 style="margin-top:0">日志</h3><div id="log" class="log">等待操作</div></div></section></main><nav class="bottom-nav"><button class="navbtn on" data-page="txt"><b>✦</b>文生图</button><button class="navbtn" data-page="edit"><b>◈</b>图生图</button><button class="navbtn" data-page="hist"><b>▣</b>历史</button><button class="navbtn" data-page="set"><b>⚙</b>设置</button></nav><div id="toast" class="toast"></div><div id="lightbox" class="lightbox" onclick="closeImg()"><button class="x" onclick="closeImg();event.stopPropagation()">×</button><img id="bigImg"></div><script>
const ratios=['Auto','16:9','9:16','1:1','4:3','3:4'],qs=['Auto','4K'],nums=['1','2','3','4'];let cur=[];function $(id){return document.getElementById(id)}function fill(id,a){$(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('')}['ratio','eratio'].forEach(id=>fill(id,ratios));['quality','equality'].forEach(id=>fill(id,qs));['num','enum'].forEach(id=>fill(id,nums));function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}function log(s){$('log').textContent=s}function status(s){$('status').textContent=s}function openImg(src){$('bigImg').src=src;$('lightbox').classList.add('on')}function closeImg(){$('lightbox').classList.remove('on');$('bigImg').src=''}document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(b.dataset.page).classList.add('on');if(b.dataset.page==='hist')loadHist()});function settings(){return{baseUrl:$('base').value.trim(),apiKey:$('key').value.trim(),model:$('model').value.trim()||'gpt-image-2',remember:$('remember').checked}}function loadSet(){let s=JSON.parse(Android.getSettings());$('base').value=s.baseUrl||'https://factory.pub';$('key').value=s.apiKey||'';$('model').value=s.model||'gpt-image-2';$('remember').checked=!!s.remember}loadSet();$('saveSet').onclick=()=>{Android.saveSettings(JSON.stringify(settings()));toast('设置已保存')};let seq=1,pending={};function call(fn,args,btn,doing){let id='r'+seq++;let old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent=doing}status(doing);return new Promise(res=>{pending[id]=r=>{if(btn){btn.disabled=false;btn.textContent=old}status('就绪');res(r)};Android[fn](id,...args)})}window.nativeResolve=r=>{let cb=pending[r.id];if(cb){delete pending[r.id];cb(r)}};$('models').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('requestModels',[s.baseUrl,s.apiKey],$('models'),'获取中');if(!r.ok){toast(r.error);log(r.error);return}$('modelList').innerHTML=(r.body.data||[]).map(m=>`<div class="model-item" onclick="model.value='${m.id}'">${m.id}</div>`).join('');toast('模型已更新')};function show(items,where='txt'){cur=items||[];let card=where==='edit'?'editResultCard':'resultCard', box=where==='edit'?'editResults':'results';$(card).classList.remove('compact');$(box).className=cur.length?'gallery':'empty';$(box).innerHTML=cur.length?cur.map((it,i)=>`<div class="imgcard"><img onclick="openImg('${it.fileUrl}')" src="${it.fileUrl}"><div class="imgcap">#${i+1} · 已入历史</div></div>`).join(''):'没有图片数据'}$('gen').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));$('resultCard').classList.remove('compact');$('results').className='empty';$('results').textContent='生成中，请稍候...';let r=await call('generateText',[s.baseUrl,s.apiKey,s.model,$('prompt').value,$('neg').value,parseInt($('num').value),$('ratio').value,$('quality').value],$('gen'),'生成中...');if(!r.ok){$('results').textContent='生成失败：'+r.error;toast(r.error);log(r.error);return}show(r.items);loadHist();toast('生成完成')};$('pick').onclick=()=>Android.pickImages();window.onImagesPicked=o=>{renderPicked(o.uris||[])};function renderPicked(uris){$('picked').textContent=uris.length?'已选择 '+uris.length+' 张图片':'未选择图片';$('pickedGrid').innerHTML=uris.map((u,i)=>`<div class="pick-card"><img onclick="openImg('${u}')" src="${u}"><button onclick="removePick(${i})">×</button></div>`).join('')}function removePick(i){Android.removePickedImage(i)}$('editBtn').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('generateEdit',[s.baseUrl,s.apiKey,s.model,$('eprompt').value,parseInt($('enum').value),$('eratio').value,$('equality').value],$('editBtn'),'编辑中...');if(!r.ok){toast(r.error);log(r.error);return}show(r.items,'edit');loadHist();toast('编辑完成')};$('saveCur').onclick=async()=>{let r=await call('saveCurrentToGallery',[],$('saveCur'),'保存中');toast(r.ok?'已保存 '+r.saved+' 张':r.error)};$('shareCur').onclick=()=>Android.shareCurrent();$('editCur').onclick=()=>Android.editCurrent();$('saveEdit').onclick=async()=>{let r=await call('saveCurrentToGallery',[],$('saveEdit'),'保存中');toast(r.ok?'已保存 '+r.saved+' 张':r.error)};$('shareEdit').onclick=()=>Android.shareCurrent();$('editEdit').onclick=()=>Android.editCurrent();function loadHist(){let h=JSON.parse(Android.loadHistory());$('history').innerHTML=h.length?h.map((x,i)=>`<div class="hist-item"><div class="hist-top">${x.time} · ${x.mode}</div><div class="hist-prompt">${x.prompt}</div><div class="thumbs">${(x.paths||[]).map(p=>`<img onclick="openImg('file://${p}')" src="file://${p}">`).join('')}</div><div class="actions three"><button class="ghost" onclick='shareHist(${JSON.stringify(x.paths||[])})'>分享</button><button class="primary" onclick='editHist(${JSON.stringify(x.paths||[])})'>编辑</button><button class="green" onclick='saveHist(${JSON.stringify(x.paths||[])})'>保存</button></div></div>`).join(''):'<div class="empty">暂无历史</div>'}function loadItem(paths){show(paths.map(p=>({fileUrl:'file://'+p,path:p})));document.querySelector('[data-page=txt]').click()}async function saveHist(paths){let id='r'+seq++;pending[id]=r=>toast(r.ok?'已保存 '+r.saved+' 张':r.error);Android.saveHistoryItemToGallery(id,JSON.stringify(paths))}function shareHist(paths){Android.shareHistoryItem(JSON.stringify(paths))}function editHist(paths){Android.editHistoryItem(JSON.stringify(paths))}$('clearHist').onclick=()=>{Android.clearHistory();loadHist();toast('已清空')};loadHist();</script></body></html>
