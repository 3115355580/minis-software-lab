<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Image2Studio</title><style>
:root{--bg:#080b12;--panel:#111827;--card:#182033;--muted:#8b96aa;--text:#f4f7ff;--p:#8b5cf6;--p2:#38bdf8;--g:#22c55e;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2b1768 0,#080b12 38%,#05070c 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:820px;margin:auto;padding:16px}.hero{border-radius:28px;padding:24px;background:linear-gradient(135deg,#8b5cf6,#4f46e5 60%,#06b6d4);box-shadow:0 18px 60px #0008}.hero h1{font-size:42px;margin:0 0 8px}.status{color:#e9d5ff;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.tab{border:0;border-radius:18px;background:#151c2d;color:#dbe4ff;padding:14px 6px;font-size:16px}.tab.on{background:linear-gradient(135deg,#7c3aed,#2563eb);color:white}.page{display:none}.page.on{display:block}.card{background:linear-gradient(180deg,#151c2d,#101624);border:1px solid #26324a;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 12px 40px #0005}.card h2{margin:0 0 6px;font-size:24px}.hint{color:var(--muted);line-height:1.45}.grid3{display:grid;grid-template-columns:1.3fr 1fr .7fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#9ca8bd;margin:14px 0 6px}textarea,input,select{width:100%;background:#090e19;color:var(--text);border:1px solid #273349;border-radius:18px;padding:14px;font-size:16px;outline:none}textarea{min-height:140px;resize:vertical}button{border:0;border-radius:18px;padding:15px 16px;color:white;font-size:16px;background:#334155}button.primary{background:linear-gradient(135deg,#8b5cf6,#2563eb)}button.green{background:linear-gradient(135deg,#22c55e,#16a34a)}button:disabled{opacity:.55}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.imgcard{background:#0b1120;border-radius:18px;overflow:hidden;border:1px solid #26324a}.imgcard img{width:100%;display:block}.imgcap{padding:10px;color:#b6c2d8;font-size:13px}.history-item{border:1px solid #2c3750;border-radius:18px;padding:12px;margin:12px 0;background:#0c1220}.thumbs{display:flex;gap:8px;overflow:auto;margin:10px 0}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:14px}.log{white-space:pre-wrap;color:#93a4bd;font-size:13px}.toast{position:fixed;left:18px;right:18px;bottom:18px;background:#111827;border:1px solid #334155;border-radius:18px;padding:14px;display:none}@media(max-width:520px){.hero h1{font-size:34px}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.app{padding:12px}.tab{font-size:14px;padding:12px 4px}}
</style></head><body><div class="app"><section class="hero"><h1>Image2Studio</h1><div>v2.0 · image2 创作工作台</div><div id="status" class="status">就绪 · 原生桥接保存 / 请求 / 选图</div></section><nav class="tabs"><button class="tab on" data-page="txt">文生图</button><button class="tab" data-page="edit">图生图</button><button class="tab" data-page="hist">历史</button><button class="tab" data-page="set">设置</button></nav>
<section id="txt" class="page on"><div class="card"><h2>文字生成图片</h2><p class="hint">比例只保留实测 4K 档位；Auto 不传 size，4K 按比例传明确尺寸。</p><label>提示词</label><textarea id="prompt" placeholder="例如：陕西咸阳520宣传海报，现代国风，温暖红金色，浪漫城市地标"></textarea><label>反向提示词</label><input id="neg" placeholder="可选"><div class="grid3"><div><label>比例</label><select id="ratio"></select></div><div><label>清晰度</label><select id="quality"></select></div><div><label>数量</label><select id="num"></select></div></div><label></label><button id="gen" class="primary">开始文生图</button></div><div class="card"><h2>当前结果</h2><div id="results" class="gallery hint">结果会显示在这里</div><div class="grid2" style="margin-top:12px"><button id="saveCur" class="green">保存当前到相册</button><button id="shareCur">分享提示</button></div></div></section>
<section id="edit" class="page"><div class="card"><h2>参考图编辑</h2><p class="hint">选择 1-4 张参考图，原生桥接 multipart 上传。</p><button id="pick">选择参考图</button><p id="picked" class="hint">未选择图片</p><label>编辑提示词</label><textarea id="eprompt"></textarea><div class="grid3"><div><label>比例</label><select id="eratio"></select></div><div><label>清晰度</label><select id="equality"></select></div><div><label>数量</label><select id="enum"></select></div></div><label></label><button id="editBtn" class="primary">开始图生图</button></div></section>
<section id="hist" class="page"><div class="card"><h2>历史画廊</h2><div id="history" class="hint">暂无历史</div><button id="clearHist">清空历史</button></div></section>
<section id="set" class="page"><div class="card"><h2>接口设置</h2><label>Base URL</label><input id="base"><label>API Key</label><input id="key" type="password"><label>模型</label><input id="model"><p><label><input id="remember" type="checkbox"> 记住 API Key</label></p><div class="grid2"><button id="models" class="primary">获取模型</button><button id="saveSet">保存设置</button></div><div id="modelList" class="hint"></div></div><div class="card"><h2>日志</h2><div id="log" class="log">等待操作</div></div></section></div><div id="toast" class="toast"></div><script>
const ratios=['Auto','16:9','9:16','1:1','4:3','3:4'], qs=['Auto','4K'], nums=['1','2','3','4'];let cur=[];function fill(id,a){let s=$(id);s.innerHTML=a.map(x=>`<option>${x}</option>`).join('')}['ratio','eratio'].forEach(id=>fill(id,ratios));['quality','equality'].forEach(id=>fill(id,qs));['num','enum'].forEach(id=>fill(id,nums));function $(id){return document.getElementById(id)}function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}function log(s){$('log').textContent=s}function status(s){$('status').textContent=s}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(b.dataset.page).classList.add('on');if(b.dataset.page==='hist')loadHist()});
function settings(){return{baseUrl:$('base').value.trim(),apiKey:$('key').value.trim(),model:$('model').value.trim()||'gpt-image-2',remember:$('remember').checked}}function loadSet(){let s=JSON.parse(Android.getSettings());$('base').value=s.baseUrl||'https://factory.pub';$('key').value=s.apiKey||'';$('model').value=s.model||'gpt-image-2';$('remember').checked=!!s.remember}loadSet();$('saveSet').onclick=()=>{Android.saveSettings(JSON.stringify(settings()));toast('设置已保存')};let seq=1,pending={};function call(fn,args,btn,doing){let id='r'+seq++;let old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent=doing}status(doing);return new Promise(res=>{pending[id]=r=>{if(btn){btn.disabled=false;btn.textContent=old}res(r)};Android[fn](id,...args)})}window.nativeResolve=r=>{let cb=pending[r.id];if(cb){delete pending[r.id];cb(r)}};
$('models').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('requestModels',[s.baseUrl,s.apiKey],$('models'),'获取中...');if(!r.ok){toast(r.error);log(r.error);return}$('modelList').innerHTML=(r.body.data||[]).map(m=>`<div style="padding:8px" onclick="model.value='${m.id}'">${m.id}</div>`).join('');toast('模型已更新')};
function show(items){cur=items||[];$('results').className='gallery';$('results').innerHTML=cur.length?cur.map((it,i)=>`<div class="imgcard"><img src="${it.fileUrl}"><div class="imgcap">#${i+1} · 已入历史</div></div>`).join(''):'没有图片数据'}
$('gen').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));$('results').className='hint';$('results').textContent='生成中，请稍候...';let r=await call('generateText',[s.baseUrl,s.apiKey,s.model,$('prompt').value,$('neg').value,parseInt($('num').value),$('ratio').value,$('quality').value],$('gen'),'文生图中...');if(!r.ok){$('results').textContent='生成失败：'+r.error;toast(r.error);log(r.error);return}show(r.items);loadHist();toast('生成完成')};
$('pick').onclick=()=>Android.pickImages();window.onImagesPicked=o=>{$('picked').textContent='已选择 '+o.count+' 张图片'};$('editBtn').onclick=async()=>{let s=settings();Android.saveSettings(JSON.stringify(s));let r=await call('generateEdit',[s.baseUrl,s.apiKey,s.model,$('eprompt').value,parseInt($('enum').value),$('eratio').value,$('equality').value],$('editBtn'),'图生图中...');if(!r.ok){toast(r.error);log(r.error);return}show(r.items);document.querySelector('[data-page=txt]').click();loadHist();toast('图生图完成')};
$('saveCur').onclick=async()=>{let r=await call('saveCurrentToGallery',[],$('saveCur'),'保存中...');toast(r.ok?'已保存 '+r.saved+' 张':r.error)};$('shareCur').onclick=()=>toast('分享由系统相册/文件管理完成更稳定');function loadHist(){let h=JSON.parse(Android.loadHistory());$('history').innerHTML=h.length?h.map((x,i)=>`<div class="history-item"><b>${x.time} · ${x.mode}</b><p>${x.prompt}</p><div class="thumbs">${(x.paths||[]).map(p=>`<img src="file://${p}">`).join('')}</div><div class="grid2"><button onclick='loadItem(${JSON.stringify(x.paths||[])})'>载入本条</button><button class="green" onclick='saveHist(${JSON.stringify(x.paths||[])})'>保存本条到相册</button></div></div>`).join(''):'暂无历史'}function loadItem(paths){show(paths.map(p=>({fileUrl:'file://'+p,path:p})))}async function saveHist(paths){let id='r'+seq++;pending[id]=r=>toast(r.ok?'已保存 '+r.saved+' 张':r.error);Android.saveHistoryItemToGallery(id,JSON.stringify(paths))}$('clearHist').onclick=()=>{Android.clearHistory();loadHist();toast('已清空')};loadHist();
</script></body></html>
